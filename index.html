<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10251f"><title>Mini MOBA — таблица лидеров</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10251f;font-family:Arial,sans-serif;touch-action:none}#game{width:100%;height:100%}#error{display:none;position:fixed;inset:10%;background:#381d1d;color:white;padding:20px;z-index:99;white-space:pre-wrap}.leaderboard-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#061a1cde;color:#f2f7e9;padding:14px;box-sizing:border-box}.leaderboard-panel{width:min(490px,96vw);max-height:92vh;overflow:auto;background:#163a36;border:2px solid #9de3bf;border-radius:16px;padding:20px;box-shadow:0 12px 50px #0009}.leaderboard-panel h2{margin:0 0 12px;text-align:center;font-size:22px}.leaderboard-best{text-align:center;color:#ffe49b}.leaderboard-state{font-size:14px;color:#cbded4;text-align:center}.leaderboard-rows{margin:14px 0}.leaderboard-row{display:flex;justify-content:space-between;gap:12px;padding:9px 6px;border-bottom:1px solid #ffffff20}.leaderboard-panel button{width:100%;padding:13px;background:#298669;color:white;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style></head><body><div id="game"></div><div id="error"></div><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="yandex-sdk.js"></script><script src="leaderboard.js"></script><script src="assets-data.js"></script><script src="sound.js"></script><script src="game.js"></script></body></html>
